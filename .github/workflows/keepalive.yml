# Keeps the Supabase project awake: a Free plan project is paused after a week without database activity, which would
# turn off invites, licence checks and the Workshop for everyone. Once a day this reads the (public) upload limits
# with the public anon key: a tiny database read, no secrets, nothing written. Free on GitHub Actions for public repos.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Workshop limits (one row)
        run: |
          URL=$(grep -o 'url: *"[^"]*"' src/workshop-config.js | head -1 | cut -d'"' -f2)
          KEY=$(grep -o 'anonKey: *"[^"]*"' src/workshop-config.js | head -1 | cut -d'"' -f2)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase project configured"; exit 0; fi
          # app_limits once supabase/schema.sql has it; the public looks list otherwise (both are a one-row read)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/app_limits?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          [ "$code" = "200" ] || code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/looks?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered $code"
          [ "$code" = "200" ]
