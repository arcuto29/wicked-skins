# Runs on every pull request and push to main: catches broken code before it ships.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check.js
      - run: node scripts/build-extension.js
      - run: node test/fit/smartfit.test.mjs   # Fit: Smart / Cover / Contain / Stretch rules
      - run: node test/perf/pacing.test.mjs   # wallpaper frame rate = the one chosen, on 60-360 Hz screens

  desktop-smoke:
    # Launches the real desktop app against tradingview.com under a virtual display.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm install --no-save playwright@1.64.1
      - run: xvfb-run -a node test/smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: desktop-screenshots, path: desktop/test-output }

  chart-colours:
    # Your colours on the chart frame by frame (brackets, drawings, indicator levels), at normal and high-DPI scale,
    # with the drawing sequences TradingView uses. Local page only, no website needed (test/colours/hook.unit.js).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node test/colours/hook.unit.js
      - run: node test/colours/hook.unit.js --dpr 2
      - run: node test/match/palette.test.js   # Auto-match: indicator / drawing colours readable, told apart, up / down kept

  workshop-rules:
    # The Workshop's database rules (supabase/schema.sql) against a real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save @electric-sql/pglite@0.5.15
      - run: node supabase/test.mjs
      - run: node supabase/licence.test.mjs

  uploads:
    # Your uploads are stored once: the same file picked again, renamed, or twice in one go is not added a second time
    # (the real panel with the extension loaded, test/uploads/dedupe.e2e.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node test/uploads/dedupe.e2e.js

  wallpaper-sound:
    # Video wallpaper sound with Chrome's real autoplay rule: off by default, the "Turn sound on" card, volume, one
    # sound across charts and tabs, Pause / Focus / trade focus / Power saver, conversion keeps it (test/audio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node test/audio/audio.e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: wallpaper-sound, path: test-output/audio }
