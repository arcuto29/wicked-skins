# Publishes site/ (home page, Workshop, Privacy, Terms) to GitHub Pages on every push to main.
name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", "src/skins.js", "src/candlelooks.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # share-link previews (look.html) draw with the extension's own wallpaper + candle code
      - run: mkdir -p site/lib && cp src/skins.js src/candlelooks.js site/lib/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
