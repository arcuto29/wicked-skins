# Builds the Android APK on GitHub's runners (which have the Android SDK) and attaches it to the run.
# Runs on demand, on pushes that touch android/ or the shared code, and attaches to a release when tagged.
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main, "ci/android-build"]
    paths: ["android/**", "src/**", "popup/**", ".github/workflows/android.yml"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Generate the Gradle wrapper (jar isn't committed)
        working-directory: android
        # retried: the Gradle download is sometimes briefly unavailable, which shouldn't fail a release
        run: for i in 1 2 3 4 5; do gradle wrapper --gradle-version 8.9 && exit 0; echo "retry $i"; sleep 30; done; exit 1
      # Signed with Priism's permanent key (secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS),
      # so every new APK installs over the last one and keeps your settings. Without the secrets: a debug build, as before.
      - name: Build the APK (signed release when the key is set up)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/priism.jks"
            ARGS="-PPRIISM_KEYSTORE=$RUNNER_TEMP/priism.jks -PPRIISM_KEYSTORE_PASSWORD=$KS_PW -PPRIISM_KEY_ALIAS=${KS_ALIAS:-priism} -PPRIISM_KEY_PASSWORD=$KS_PW"
            for i in 1 2 3; do ./gradlew --no-daemon assembleRelease $ARGS && break; echo "retry $i"; sleep 30; [ $i = 3 ] && exit 1; done
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::No Android signing key secrets: building a debug APK (it can't update over the last one)."
            for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && break; echo "retry $i"; sleep 30; [ $i = 3 ] && exit 1; done
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Rename the APK
        working-directory: android
        run: |
          mkdir -p out
          case "$GITHUB_REF" in refs/tags/v*) N="Priism-Skins-${GITHUB_REF_NAME#v}-android.apk";; *) N="Priism-Skins-android.apk";; esac
          cp "$APK" "out/$N"
          ls -la out
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: priism-skins-android-apk
          path: android/out/*.apk
          if-no-files-found: error
      # On a version tag, also attach the APK to the GitHub Release.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
