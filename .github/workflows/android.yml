# Builds the Android APK on GitHub's runners (which have the Android SDK) and attaches it to the run.
# Runs on demand, on pushes that touch android/ or the shared code, and attaches to a release when tagged.
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main, "ci/android-build"]
    paths: ["android/**", "src/**", "popup/**", ".github/workflows/android.yml"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate the Gradle wrapper (jar isn't committed)
        working-directory: android
        run: gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename the APK
        working-directory: android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Priism-Skins-${GITHUB_REF_NAME#v}-android.apk" 2>/dev/null \
            || cp app/build/outputs/apk/debug/app-debug.apk "out/Priism-Skins-android.apk"
          ls -la out
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: priism-skins-android-apk
          path: android/out/*.apk
          if-no-files-found: error
      # On a version tag, also attach the APK to the GitHub Release.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
