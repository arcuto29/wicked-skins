# Builds a test APK on GitHub's runners (which have the Android SDK) and attaches it to the run, on demand and on
# pushes that touch android/ or the shared code. It never publishes anything: releases (signed with Priism's
# permanent key, after the owner's approval) are made by release.yml.
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main, "ci/android-build"]
    paths: ["android/**", "src/**", "popup/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Releases go to the public repo (needs the PUBLIC_REPO_TOKEN secret)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { T: "${{ secrets.PUBLIC_REPO_TOKEN }}" }
        run: '[ -n "$T" ] || { echo "::error::Add the PUBLIC_REPO_TOKEN secret (see RELEASING.md). Releases are published to the public priismskins/priismskins.github.io repo."; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Generate the Gradle wrapper (jar isn't committed)
        working-directory: android
        # retried: the Gradle download is sometimes briefly unavailable, which shouldn't fail a release
        run: for i in 1 2 3 4 5; do gradle wrapper --gradle-version 8.9 && exit 0; echo "retry $i"; sleep 30; done; exit 1
      # a debug build (test builds only; it can't install over a release, which is signed with Priism's own key)
      - name: Build the test APK
        working-directory: android
        run: for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && exit 0; echo "retry $i"; sleep 30; done; exit 1
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: priism-skins-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
