<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10202b"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <!-- one spectrum across all three candles: light "split" by the chart -->
    <linearGradient id="spec" gradientUnits="userSpaceOnUse" x1="26" y1="104" x2="104" y2="24">
      <stop offset="0" stop-color="#19d3ff"/>
      <stop offset="0.5" stop-color="#2ef2b0"/>
      <stop offset="1" stop-color="#c6ff3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="29.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- soft diagonal light beam behind the candles -->
  <path d="M10 112 L112 10 L124 22 L22 124 Z" fill="url(#beam)"/>
  <circle cx="91" cy="38" r="30" fill="url(#glow)"/>
  <!-- three rising candles -->
  <g fill="url(#spec)">
    <rect x="35.5" y="66" width="5" height="40" rx="2.5"/>
    <rect x="28" y="74" width="20" height="24" rx="5"/>
    <rect x="61.5" y="44" width="5" height="54" rx="2.5"/>
    <rect x="54" y="52" width="20" height="36" rx="5"/>
    <rect x="87.5" y="20" width="5" height="62" rx="2.5"/>
    <rect x="80" y="28" width="20" height="44" rx="5"/>
  </g>
  <!-- glint on the newest candle -->
  <path d="M90 13 L91.6 18.4 L97 20 L91.6 21.6 L90 27 L88.4 21.6 L83 20 L88.4 18.4 Z" fill="#f4ffd6"/>
</svg>
